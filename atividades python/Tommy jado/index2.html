<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo 67 - Efeitos Visuais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Canvas que cobre toda a tela */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Interface do usuário por cima dos efeitos */
        .interface {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            color: white;
            pointer-events: none; /* Permite clicar através do texto */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff007f, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="interface">
        <h1>MATRIZ 67</h1>
        <p>Mova o mouse ou toque na tela para interagir com os milhares de efeitos</p>
    </div>

    <canvas id="effectCanvas"></canvas>

    <script>
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');

        // Ajusta o tamanho do canvas para ocupar a tela inteira
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Configurações dos efeitos
        const PARTICLE_COUNT = 1500; // Milhares de partículas de fundo
        const NUMBER_COUNT = 13;      // Quantidade de números "67" voando simultaneamente
        const particles = [];
        const numbers = [];
        let hue = 0; // Controla a mudança de cor do arco-íris

        // Objeto para rastrear o mouse
        const mouse = {
            x: null,
            y: null,
            radius: 150
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Classe para as milhares de mini partículas de efeito
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5;
                this.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Efeito de repulsão do mouse
                if (mouse.x != null && mouse.y != null) {
                    let dx = this.x - mouse.x;
                    let dy = this.y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        this.x += (dx / distance) * force * 5;
                        this.y += (dy / distance) * force * 5;
                    }
                }

                // Se sair da tela, reseta
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Classe para o número 67 voador
        class Floating67 {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100; // Começa abaixo da tela
                this.fontSize = Math.random() * 40 + 20; // Vários tamanhos (efeito de profundidade)
                this.speedY = -(Math.random() * 2 + 1); // Sobe em velocidades diferentes
                this.speedX = (Math.random() - 0.5) * 2; // Pequeno balanço lateral
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                this.alpha = Math.random() * 0.5 + 0.5; // Transparência variada
                this.glow = Math.random() * 20 + 5; // Intensidade do brilho néon
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;

                // Efeito de atração/gravidade leve com o mouse
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 250) {
                        this.x += dx * 0.01;
                        this.y += dy * 0.01;
                    }
                }

                // Se o 67 sumir no topo da tela, reseta ele embaixo
                if (this.y < -60 || this.x < -60 || this.x > canvas.width + 60) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Efeito Dinâmico de Cor Arco-Íris Neon
                ctx.shadowBlur = this.glow;
                ctx.shadowColor = `hsl(${(hue + this.x) % 360}, 100%, 50%)`;
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                
                ctx.font = `bold ${this.fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('13', 0, 0);
                
                ctx.restore();
            }
        }

        // Inicializa as listas de objetos
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }
        for (let i = 0; i < NUMBER_COUNT; i++) {
            numbers.push(new Floating67());
        }

        // Loop de animação principal
        function animate() {
            // EFEITO DE RASTRO: Em vez de limpar totalmente a tela com clearRect,
            // desenha-se um retângulo quase transparente, criando um rastro de luz.
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            hue += 0.5; // Avança a cor do arco-íris gradativamente

            // Atualiza e desenha as milhares de partículas de fundo
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            // Atualiza e desenha os números 67 voadores
            numbers.forEach(num => {
                num.update();
                num.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
